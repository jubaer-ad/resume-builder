services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: resume-builder:latest
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: ${PORT:?Copy .env.example to .env and set PORT}
    ports:
      - "127.0.0.1:${PORT:?Copy .env.example to .env and set PORT}:${PORT:?Copy .env.example to .env and set PORT}"
